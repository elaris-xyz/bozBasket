[package]
name = "basket_dca"
version = "0.1.0"
description = "bozBasket - session-aware DCA into baskets of tokenized US stocks"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "basket_dca"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "mock_market/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token"] }
mock_market = { path = "../mock_market", features = ["cpi"] }
